name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test against the latest LTS versions
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # Caching dependencies speeds up the pipeline
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint

  build:
    needs: [lint]
    runs-on: ubuntu-latest
    services:
      memcached:
        image: memcached:1.6-alpine
        ports:
          - 11211:11211

    strategy:
      matrix:
        # Test against the latest LTS versions
        node-version: [20.x, 22.x]
        sequelize-version: ["^5.21.6", "^6.0.0"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # Caching dependencies speeds up the pipeline
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Pin Sequelize version
      run: npm install sequelize@${{ matrix.sequelize-version }} --workspace sequelize-transparent-cache --save-dev

    - name: Run tests
      run: npm test

